[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmonadepress"
version = "0.5.0"
description = "LLMonadePress — AI-powered daily newspaper generator for E-Ink tablets and beyond"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "LLMonadePress Contributors"}]
dependencies = [
    "typer[all]>=0.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "litellm>=1.40",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.1",
    "faster-whisper>=1.0",
    "aiosmtplib>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tomli>=2.0;python_version<'3.11'",
    "httpx>=0.27",
    "rich>=13.0",
    "aiofiles>=24.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/lemonade-newspaper/lemonade"
Repository = "https://github.com/lemonade-newspaper/lemonade"
Issues = "https://github.com/lemonade-newspaper/lemonade/issues"

[project.scripts]
lemonade = "llmonadepress.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "factory-boy>=3.3",
    "testcontainers[postgres]>=4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["llmonadepress"]

# Bundle device profiles and Typst templates into the wheel under
# llmonadepress/_bundled/ so the package is self-contained when pip-installed.
# In editable mode the loader falls back to the repo-root copies.
[tool.hatch.build.targets.wheel.force-include]
"device_profiles" = "llmonadepress/_bundled/device_profiles"
"templates" = "llmonadepress/_bundled/templates"

# LLMonadePress project-level metadata. The list of output languages here is the
# single source of truth — adding a language requires:
#   1. Adding a translation pack to lemonade/llm/prompts/i18n.py
#   2. Adding the code to ``supported_languages`` below
[tool.llmonadepress]
default_language = "en"
supported_languages = ["en", "de", "fr"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
