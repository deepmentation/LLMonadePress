services:
  # Lemonade is a batch job, not a long-running service. The app container
  # exists so you can invoke commands inside it via `docker compose run --rm app …`
  # (e.g. `docker compose run --rm app run`). It is excluded from `docker compose up`
  # via the `manual` profile so a missing config.toml doesn't put it in a crash loop.
  app:
    build: .
    profiles: ["manual"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override .env: inside the Docker network the DB hostname is `db`,
      # not `localhost`. The .env value uses localhost so non-Docker dev
      # setups (running `lemonade` directly) work out of the box.
      DATABASE_URL: postgresql+asyncpg://lemonade:${DB_PASS:-changeme}@db:5432/lemonade
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./output:/app/output
      - rmapi-config:/root/.config/rmapi

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lemonade
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
      POSTGRES_DB: lemonade
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemonade"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  rmapi-config:
